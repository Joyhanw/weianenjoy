<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海牛AI应用平台 · 一期</title>
<style>
/* ============ 全局变量 ============ */
:root{
  --primary:#1A66FF;
  --primary-dark:#0F47C7;
  --primary-light:#E8F0FF;
  --success:#00B42A;
  --warning:#FF7D00;
  --danger:#F53F3F;
  --text-1:#1D2129;
  --text-2:#4E5969;
  --text-3:#86909C;
  --text-4:#C9CDD4;
  --bg-page:#F2F3F5;
  --bg-card:#FFFFFF;
  --border:#E5E6EB;
  --border-light:#F0F1F3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:8px;
  --radius-sm:6px;
  --radius-lg:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:var(--bg-page);color:var(--text-1);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
ul{list-style:none}
input,textarea,select{font-family:inherit;font-size:13px;outline:none}

/* ============ 登录页 ============ */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0A1628 0%,#132244 50%,#0A1628 100%);
  position:relative;overflow:hidden;
}
.login-page::before{
  content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(26,102,255,.12) 0%,transparent 70%);
  top:-200px;right:-200px;
}
.login-page::after{
  content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,255,.08) 0%,transparent 70%);
  bottom:-150px;left:-150px;
}
.login-card{
  width:400px;background:#fff;border-radius:16px;padding:40px 36px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;z-index:1;
}
.login-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px}
.login-logo-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#1A66FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700}
.login-logo-text{font-size:22px;font-weight:700;color:var(--text-1)}
.login-logo-sub{font-size:12px;color:var(--text-3);text-align:center;margin-top:4px}
.login-hint{font-size:12px;color:var(--text-4);text-align:center;margin-bottom:24px;padding:10px;background:#F7F8FA;border-radius:8px;line-height:1.6}
.login-hint strong{color:var(--text-2)}
.login-field{margin-bottom:20px}
.login-label{font-size:13px;color:var(--text-2);margin-bottom:6px;display:block}
.login-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;transition:.2s;background:#FAFBFC}
.login-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);background:#fff}
.login-btn{width:100%;padding:13px;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:.15s;margin-top:8px}
.login-btn:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,102,255,.3)}
.login-error{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;display:none}

/* ============ 主布局 ============ */
.app{display:none;flex-direction:column;height:100vh;overflow:hidden}
.app.logged-in{display:flex}
.header{
  height:52px;background:#fff;display:flex;align-items:center;padding:0 20px;
  flex-shrink:0;border-bottom:1px solid var(--border);z-index:100;
}
.header-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.header-logo-icon{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#1A66FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.header-logo .sub{font-size:11px;color:var(--text-3);font-weight:400;margin-left:4px}
.header-center{flex:1;display:flex;justify-content:center;gap:4px}
.header-nav{display:flex;gap:2px;background:var(--bg-page);border-radius:8px;padding:3px}
.header-nav-item{padding:6px 18px;border-radius:6px;font-size:13px;color:var(--text-2);cursor:pointer;transition:.15s;user-select:none}
.header-nav-item:hover{color:var(--text-1)}
.header-nav-item.active{background:#fff;color:var(--primary);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.header-right{display:flex;align-items:center;position:relative}
.header-user{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px;transition:.15s}
.header-user:hover{background:var(--bg-page)}
.header-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1A66FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600}
.header-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:5px;min-width:130px;display:none;z-index:200}
.header-dropdown.open{display:block}
.header-dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;font-size:13px;color:var(--text-2);cursor:pointer;transition:.15s;user-select:none}
.header-dropdown-item:hover{background:var(--primary-light);color:var(--primary)}
.header-dropdown-item.logout{color:var(--danger)}
.header-dropdown-item.logout:hover{background:#FFF1F0}
.main{flex:1;overflow-y:auto;background:var(--bg-page)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:3px}

/* ============ 通用组件 =========== */
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:var(--text-1)}
.card-body{padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--text-2);border:1px solid var(--border);transition:.15s;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-lg{padding:10px 22px;font-size:14px}
.btn-ghost{background:transparent;border:none;color:var(--primary)}
.btn-ghost:hover{background:var(--primary-light)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;border-radius:4px;line-height:1.5}
.tag-primary{background:var(--primary-light);color:var(--primary)}
.tag-success{background:#E8FFEA;color:var(--success)}
.tag-gray{background:#F2F3F5;color:var(--text-3)}
.tag-info{background:#F2EDFF;color:var(--info)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:#FAFBFC;color:var(--text-3);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:12px;white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid var(--border-light);color:var(--text-2)}
.table tr:hover td{background:#FAFBFC}
.table tr:last-child td{border-bottom:none}

/* ============ AI创建首页 ======*===== */
.ai-home{display:flex;flex-direction:column;align-items:center;padding:60px 48px 24px;min-height:100%}
.ai-title{font-size:32px;font-weight:700;color:var(--text-1);text-align:center;margin-bottom:6px;letter-spacing:-.5px}
.ai-title .highlight{color:var(--primary)}
.ai-subtitle{font-size:14px;color:var(--text-3);text-align:center;margin-bottom:24px}
.ai-input-device{display:flex;gap:2px;background:var(--bg-sunken,#F0F3F7);border-radius:10px;padding:3px;margin-bottom:14px;width:fit-content;position:relative}
.ai-input-device-btn{display:flex;align-items:center;gap:5px;padding:6px 20px;border-radius:8px;font-size:13px;color:var(--text-3);cursor:pointer;transition:all .2s;font-family:inherit}
.ai-input-device-btn .dev-ico{font-size:14px;line-height:1}
.ai-input-device-btn:hover{color:var(--text-1)}
.ai-input-device-btn.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(17,31,61,.12)}
.ai-input-device-btn.active .dev-ico{color:var(--primary)}
.ai-input-area{width:100%;max-width:760px;margin-bottom:20px}
.ai-input-big{width:100%;min-height:180px;border:1.5px solid var(--border);border-radius:24px;padding:28px 32px 72px;font-size:17px;font-family:inherit;resize:none;line-height:1.8;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:.2s;color:var(--text-1)}
.ai-input-big:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ai-input-big::placeholder{color:var(--text-4)}
.ai-input-tools{display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin-top:-54px;position:relative}
.ai-input-tools-left{display:flex;align-items:center;gap:4px}
.ai-tool-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;font-size:13px;color:var(--text-2);border:none;background:none;cursor:pointer;transition:.15s}
.ai-tool-btn:hover{background:var(--primary-light);color:var(--primary)}
.ai-input-tools-right{display:flex;align-items:center;gap:8px}
.ai-model-select{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;font-size:12px;color:var(--text-2);border:1px solid var(--border);background:#fff;cursor:pointer;transition:.15s}
.ai-model-select:hover{border-color:var(--primary);color:var(--primary)}
.ai-generate-btn{display:flex;align-items:center;gap:6px;padding:10px 24px;border-radius:12px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;font-family:inherit;box-shadow:0 2px 8px rgba(26,102,255,.3)}
.ai-generate-btn:hover{background:var(--primary-dark)}

/* ============ 需求说明书页 ============ */
.ai-my-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ai-my-title{font-size:15px;font-weight:600;color:var(--text-1)}
.ai-my-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ai-my-card{border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;border:1px solid var(--border);background:#fff}
.ai-my-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(26,102,255,.1);border-color:var(--primary)}
.ai-my-card-cover{height:90px;display:flex;align-items:center;justify-content:center;font-size:40px}
.ai-my-card-body{padding:10px 14px 12px;background:#fff}
.ai-my-card-name{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-my-card-meta{font-size:11px;color:var(--text-3);display:flex;gap:6px}

/* ============ 需求说明书页 ============ */
.spec-page{display:flex;height:100%;overflow:hidden;background:var(--bg-page)}
.spec-main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:24px 32px}
.spec-chat-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.spec-chat-area::-webkit-scrollbar{width:5px}
.spec-chat-area::-webkit-scrollbar-thumb{background:var(--text-4);border-radius:3px}

/* 需求说明书卡片 */
.spec-card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04);animation:specIn .4s ease}
@keyframes specIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.spec-card-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.spec-card-title{font-size:15px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:8px}
.spec-card-actions{display:flex;gap:6px}
.spec-card-body{padding:16px 20px}
.spec-section{margin-bottom:20px}
.spec-section:last-child{margin-bottom:0}
.spec-section-label{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.spec-section-label .sl-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;align-items:center;justify-content:center;flex-shrink:0}
.spec-section-content{font-size:13px;color:var(--text-2);line-height:1.7}

/* 需求说明书编辑大输入框 */
.spec-edit-big{width:100%;min-height:500px;border:1px solid var(--border);border-radius:10px;padding:16px;font-size:13px;font-family:inherit;line-height:1.8;resize:vertical;background:#fff;color:var(--text-1)}
.spec-edit-big:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}

/* 消息泡 */
.spec-msg{display:flex;max-width:85%;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spec-msg.user{align-self:flex-end}
.spec-msg.bot{align-self:flex-start}
.spec-msg-bubble{padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.7}
.spec-msg.bot .spec-msg-bubble{background:#fff;color:var(--text-1);border:1px solid var(--border);border-bottom-left-radius:4px}
.spec-msg.user .spec-msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}

/* 底部操作栏 */
.spec-bottom{display:flex;align-items:center;gap:10px;padding:12px 0;flex-shrink:0}
.spec-input-wrap{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:4px;display:flex;align-items:center;transition:.2s}
.spec-input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.spec-input{flex:1;border:none;padding:10px 14px;font-size:13px;background:transparent;outline:none;font-family:inherit}
.spec-send-btn{width:38px;height:38px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s;border:none;font-size:15px}
.spec-send-btn:hover{background:var(--primary-dark)}
.spec-gen-btn{display:flex;align-items:center;gap:6px;padding:10px 22px;border-radius:10px;background:var(--success);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;flex-shrink:0;font-family:inherit}
.spec-gen-btn:hover{background:#009A24}
.spec-gen-btn:disabled{background:var(--text-4);cursor:not-allowed}

/* ============ 画布详情页 ============ */
.canvas-layout{display:flex;height:100%;background:var(--bg-page)}
.canvas-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.canvas-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.canvas-topbar-left{display:flex;align-items:center;gap:10px}
.canvas-back{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;border:1px solid var(--border);background:#fff;display:flex;align-items:center;gap:4px}
.canvas-back:hover{border-color:var(--primary);color:var(--primary)}
.canvas-title{font-size:14px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:6px}
.canvas-title .ver{font-size:11px;color:var(--text-3);font-weight:400}
.canvas-topbar-right{display:flex;gap:6px;align-items:center}
.canvas-topbar-btn{padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-2);transition:.15s;display:inline-flex;align-items:center;gap:4px}
.canvas-topbar-btn:hover{border-color:var(--primary);color:var(--primary)}
.canvas-topbar-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.canvas-topbar-btn.primary:hover{background:var(--primary-dark)}
.canvas-area{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.canvas-frame{width:100%;min-width:max-content;min-height:400px;border-radius:16px;background:#fff;position:relative;transition:.3s;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.canvas-frame.loading{border:2px solid transparent;background:linear-gradient(#fff,#fff)padding-box,linear-gradient(90deg,var(--primary),#7DB4FF,var(--primary),#7DB4FF)border-box;background-size:300%100%;animation:borderFlow 2s linear infinite}
@keyframes borderFlow{0%{background-position:0%50%}100%{background-position:300%50%}}
.canvas-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;padding:60px}
.canvas-spinner{width:48px;height:48px;border:3px solid var(--border-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.canvas-loading-text{font-size:16px;font-weight:600;color:var(--text-1)}
.canvas-loading-step{font-size:12px;color:var(--text-3)}
.canvas-preview{padding:24px 32px}

/* 小程序预览页 */
.preview-mini-pages{display:flex;gap:16px;flex-wrap:nowrap;justify-content:center}
.ai-mini-page{width:260px;flex-shrink:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(26,102,255,.08);border:1px solid var(--border)}
.ai-mp-statusbar{display:flex;justify-content:space-between;padding:6px 14px 2px;font-size:10px;color:var(--text-1)}
.ai-mp-header{padding:8px 14px;font-size:14px;font-weight:600;color:var(--text-1);text-align:center;border-bottom:1px solid var(--border-light)}
.ai-mp-body{padding:10px;min-height:300px;background:#FAFAF7}
.ai-mp-tabbar{display:flex;justify-content:space-around;padding:6px 0;background:#fff;border-top:1px solid var(--border-light);font-size:10px;color:var(--text-3)}
.ai-mp-tabbar .tab-active{color:var(--primary);font-weight:600}
.ai-mp-search{background:#F3F3F0;border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text-3);margin-bottom:8px}
.ai-mp-list-item{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.ai-mp-item-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.ai-mp-item-name{font-size:12px;font-weight:500;color:var(--text-1)}
.ai-mp-item-sub{font-size:10px;color:var(--text-3);margin-top:1px}
.ai-mp-form-group{margin-bottom:8px}
.ai-mp-form-label{font-size:11px;color:var(--text-2);margin-bottom:3px;display:block}
.ai-mp-form-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-1);background:#fff}
.ai-mp-form-select{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-1);background:#fff}
.ai-mp-form-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-1);background:#fff;min-height:50px;resize:none}
.ai-mp-submit{width:100%;padding:10px;border-radius:10px;background:var(--primary);color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px}
.ai-mp-stats{display:flex;gap:6px;margin-bottom:8px}
.ai-mp-stat{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.ai-mp-stat-val{font-size:18px;font-weight:700;color:var(--text-1)}
.ai-mp-stat-lbl{font-size:10px;color:var(--text-3);margin-top:2px}
.ai-mp-qrcode{text-align:center;padding:24px 0}
.ai-mp-qrcode-box{width:100px;height:100px;background:#F3F3F0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 8px}
.ai-mp-profile{text-align:center;padding:12px 0}
.ai-mp-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 6px;font-weight:600}
.ai-mp-profile-name{font-size:14px;font-weight:600;color:var(--text-1)}
.ai-mp-profile-role{font-size:11px;color:var(--text-3);margin-top:2px}

/* ============ PC端Mock页面 ============ */
.pc-mock{width:100%;background:#F7F8FA;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.pc-mock-header{background:linear-gradient(135deg,var(--primary),#0050D0);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.pc-mock-title{font-size:15px;font-weight:600}
.pc-mock-user{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}
.pc-mock-nav{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 16px;gap:0}
.pc-mock-nav-item{padding:10px 18px;font-size:12px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.pc-mock-nav-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.pc-mock-body{padding:20px 24px}
.pc-mock-search{display:flex;gap:8px;margin-bottom:16px}
.pc-mock-search input{width:220px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.pc-mock-search select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.pc-mock-table{width:100%;border-collapse:collapse;font-size:12px}
.pc-mock-table th{background:#FAFBFC;color:var(--text-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-light);font-size:11px}
.pc-mock-table td{padding:9px 10px;border-bottom:1px solid var(--border-light);color:var(--text-2)}
.pc-mock-table tr:hover td{background:#FAFBFC}
.pc-mock-toolbar{display:flex;gap:6px;margin-bottom:12px}
.pc-mock-toolbar .btn{padding:5px 12px;font-size:12px}
.pc-mock-stats{display:flex;gap:12px;margin-bottom:16px}
.pc-mock-stat{flex:1;background:#fff;border-radius:8px;padding:14px;border:1px solid var(--border-light);text-align:center}
.pc-mock-stat-val{font-size:20px;font-weight:700;color:var(--text-1)}
.pc-mock-stat-lbl{font-size:11px;color:var(--text-3);margin-top:2px}

/* ============ 右侧AI对话框 ============ */
.canvas-chat{position:relative;width:380px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.canvas-chat-head{padding:12px 16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between}
.canvas-chat-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.canvas-chat-close{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;opacity:.8}
.canvas-chat-msgs{padding:12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#FAFAF7}
.canvas-chat-msgs::-webkit-scrollbar{width:4px}
.canvas-chat-msgs::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:2px}
.canvas-chat-msg{display:flex;max-width:92%}
.canvas-chat-msg.bot{align-self:flex-start}
.canvas-chat-msg.user{align-self:flex-end}
.canvas-chat-bubble{padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.6}
.canvas-chat-msg.bot .canvas-chat-bubble{background:#fff;color:var(--text-1);border:1px solid var(--border);border-bottom-left-radius:3px}
.canvas-chat-msg.user .canvas-chat-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:3px}
.canvas-chat-input{padding:8px 10px;border-top:1px solid var(--border-light);display:flex;gap:6px;background:#fff;align-items:center}
.canvas-chat-input textarea{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;resize:none;min-height:36px;max-height:80px;font-family:inherit}
.canvas-chat-input textarea:focus{outline:none;border-color:var(--primary)}
.canvas-chat-close-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--text-3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.canvas-chat-close-btn:hover{background:var(--bg-page);color:var(--text-1)}
.canvas-chat-send{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.canvas-chat-send:hover{background:var(--primary-dark)}
.canvas-chat-thinking{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3);font-style:italic;padding:4px 0}
.canvas-chat-think-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* ============ 弹窗 & Toast ============ */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;animation:fade .2s}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:520px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-close{font-size:20px;color:var(--text-3);cursor:pointer;line-height:1;padding:2px}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;background:#FAFBFC}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1D2129;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;align-items:center;gap:8px}
.toast.show{display:flex;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page{padding:20px 24px;animation:fade .25s ease}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:18px;font-weight:600;color:var(--text-1)}
</style>

/* ============ 工具函数 ============ */
function $(s){return document.querySelector(s)}

function showToast(msg, type='info'){
  const t=$('#toast');
  t.textContent=msg;
  t.className='toast show '+type;
  setTimeout(()=>t.className='toast',2500);
}

function openModal(title, body, cb, options){
  $('#modalTitle').textContent=title;
  $('#modalBody').innerHTML=body;
  $('#modalMask').classList.add('open');
  $('#modalFoot').innerHTML=options?.hideFoot?'':`<button class="btn" onclick="closeModal()">关闭</button>${cb?`<button class="btn btn-primary" onclick="modalCb()">确定</button>`:''}`;
  window._modalCb=cb;
  const m=$('#modalMask').querySelector('.modal');
  if(options?.width) m.style.width=options.width;
  else m.style.width='';
}
function closeModal(){ $('#modalMask').classList.remove('open'); }
function modalCb(){
  const r=window._modalCb?.();
  if(r!==false) closeModal();
}

/* ============ 登录 ============ */
function doLogin(){
  const u=$('#loginUser').value.trim();
  const p=$('#loginPass').value.trim();
  if(u==='admin'&&p==='123456'){
    STATE.loggedIn=true;
    STATE.page='home';
    $('#loginPage').style.display='none';
    const app=$('#app');
    app.classList.add('logged-in');
    renderPage();
  }else{
    $('#loginError').style.display='block';
  }
}

function doLogout(){
  STATE.loggedIn=false;
  STATE.page='login';
  $('#app').classList.remove('logged-in');
  $('#loginPage').style.display='';
  $('#loginError').style.display='none';
}

function renderPage(){

    'canvas':pageCanvas,

  $('#main').innerHTML=fn();
  // 高亮导航
  document.querySelectorAll('.header-nav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.nav===STATE.nav);
  });
}

function switchNav(nav){
  STATE.nav=nav;
  if(nav==='myapps'){
    STATE.page='home';
    $('#main').innerHTML=pageMyApps();
  }else{
    STATE.page='home';
    renderPage();
  }
  document.querySelectorAll('.header-nav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.nav===STATE.nav);
  });
}

function toggleHeaderMenu(){
  const dd=$('#headerDropdown');

        </div>

function specChatSend(){
  const inp=$('#specChatInput');
  if(!inp) return;
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  STATE.specChat.push({role:'user',text});
  // 模拟AI回复修改
  setTimeout(()=>{
    STATE.specChat.push({role:'bot',text:'已根据你的意见调整需求说明书。请确认是否还有其他需要修改的地方？'});
    renderPage();
    scrollSpecDown();
  },600);
  renderPage();
  scrollSpecDown();
}

function scrollSpecDown(fast){
  const delay=fast?30:300;
  setTimeout(()=>{
    const area=$('#specChatArea');
    if(area){
      area.scrollTop=area.scrollHeight;
      setTimeout(()=>{area.scrollTop=area.scrollHeight},150);
    }
  },delay);
}

function editSpec(){
  const spec=STATE.specData;
  if(!spec) return;
  STATE.editingSpec=true;
  // 保存当前段落文本
  STATE.specSections = {};
  const keys=Object.keys(spec);
  keys.forEach((k,i)=>{ STATE.specSections[k]=spec[k]; });
  renderPage();
  scrollSpecDown();
}

function renderSpecEditor(spec, labels){
  const keys=Object.keys(spec);
  const fullText=keys.map((k,i)=>`【${labels[i]}】\n${spec[k]||''}`).join('\n\n');
  return `
    <div class="spec-card" style="margin-top:4px">
      <div class="spec-card-head">
        <div class="spec-card-title">✏ 编辑需求说明书</div>
        <div class="spec-card-actions">
          <button class="btn btn-sm" onclick="cancelSpecEdit()">取消</button>
          <button class="btn btn-sm btn-primary" style="background:var(--success);border-color:var(--success)" onclick="saveSpecEdit()">保存</button>
        </div>
      </div>
      <div class="spec-card-body">
        <textarea class="spec-edit-big" id="editSpecBig" placeholder="编辑完整的需求说明书...">${fullText}</textarea>
      </div>
      <div style="border-top:1px solid var(--border-light);padding:14px 20px;display:flex;align-items:center;gap:12px;background:#FAFBFC;border-bottom-left-radius:14px;border-bottom-right-radius:14px">
        <div style="flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px 10px">
          <input style="flex:1;border:none;padding:8px 0;font-size:13px;outline:none;font-family:inherit;background:transparent" id="specModInput" placeholder="输入修改意见..." onkeydown="if(event.key==='Enter'){event.preventDefault();specConfirmAndGen()}">
        </div>
        <button class="btn btn-primary" onclick="saveSpecEdit()" style="padding:9px 20px;border-radius:8px;font-size:13px">⚡ 立即生成</button>
      </div>
    </div>`;
}

function cancelSpecEdit(){
  STATE.editingSpec=false;
  STATE.specSections=null;
  renderPage();
  scrollSpecDown();
}

function saveSpecEdit(){
  const spec=STATE.specData;
  if(!spec) return;
  const keys=Object.keys(spec);
  const labels=['应用概述','目标用户','页面范围','核心功能','数据字段','业务规则','本期不实现','验收重点'];
  const el=$('#editSpecBig');
  if(el){
    // 从大输入框按段落标题切分
    const raw=el.value;
    keys.forEach((k,i)=>{
      const nextLabel=i+1<keys.length?labels[i+1]:'';
      const reg=new RegExp('【'+labels[i]+'】([\\s\\S]*?)(?=【'+nextLabel+'】|$)','');
      const m=reg.exec(raw);
      if(m) spec[keys[i]]=m[1].trim();
    });
  }
  STATE.editingSpec=false;
  STATE.specSections=null;
  // 停留在当前页
  renderPage();
}

function specConfirmAndGen(){
  if(STATE.generating) return;
  STATE.generating=true;
  STATE.page='canvas';
  STATE.loadingStep=0;
  STATE.chatMsgs=[
    {role:'bot',text:'已收到确认的需求说明书，正在为你生成应用...'},
    {role:'bot',spec:STATE.specData,text:''},
  ];
  const scene=AI_SCENES[STATE.result.scene]||AI_SCENES.event;
  const deviceLabel=STATE.device==='mini'?'小程序':'PC端';
  renderPage();

  const steps=[`正在理解你的需求...`,`正在生成需求卡...`,`匹配${deviceLabel}组件...`,`生成页面结构...`,`部署预览中...`];
  let i=0;
  function runStep(){
    if(i<steps.length){
      STATE.loadingStep=i;
      STATE.chatMsgs.push({role:'bot',text:steps[i]});
      renderPage();
      scrollCanvasDown();
      i++;
      setTimeout(runStep,800);
    }else{
      finishGen();
    }
  }
  function finishGen(){
    STATE.generating=false;
    STATE.chatMsgs.push({role:'bot',text:`${scene.name}（${deviceLabel}）已生成完成！你可以在画布中预览，或在右侧对话框继续修改。`});
    renderPage();
    scrollCanvasDown();
  }
  runStep();
}

function renderMiniPage(p,scene,idx){

  if(p.type==='list'){
    body=`<div class="ai-mp-search">🔍 搜索</div>${p.items.map(it=>`
      <div class="ai-mp-list-item">
        <div class="ai-mp-item-icon" style="background:${it.color}">${it.icon}</div>

  }else if(p.type==='form'){
    body=p.fields.map(f=>{
      if(f.type==='select') return `<div class="ai-mp-form-group"><label class="ai-mp-form-label">${f.label}</label><select class="ai-mp-form-select">${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
      if(f.type==='textarea') return `<div class="ai-mp-form-group"><label class="ai-mp-form-label">${f.label}</label><textarea class="ai-mp-form-textarea" placeholder="${f.placeholder||''}"></textarea></div>`;
      return `<div class="ai-mp-form-group"><label class="ai-mp-form-label">${f.label}</label><input class="ai-mp-form-input" placeholder="${f.placeholder||''}"></div>`;
    }).join('')+'<button class="ai-mp-submit">提交报名</button>';
  }else if(p.type==='report'){
    body=`<div class="ai-mp-stats">${p.stats.map(s=>`<div class="ai-mp-stat"><div class="ai-mp-stat-val">${s.value}</div><div class="ai-mp-stat-lbl">${s.label}</div></div>`).join('')}</div><div class="ai-mp-chart-block" style="background:#fff;border-radius:10px;padding:40px;text-align:center;color:var(--text-4);font-size:12px">📊 图表区域</div>`;
  }else if(p.type==='qrcode'){
    body=`<div class="ai-mp-qrcode"><div class="ai-mp-qrcode-box">▦</div><div style="font-size:13px;font-weight:500;color:var(--text-1)">扫码签到</div><div style="font-size:11px;color:var(--text-3);margin-top:4px">请使用微信扫一扫</div></div>`;
  }else if(p.type==='profile'){
    body=`<div class="ai-mp-profile"><div class="ai-mp-avatar">${scene.name[0]}</div><div class="ai-mp-profile-name">${p.name||'用户'}</div><div class="ai-mp-profile-role">${p.role||''}</div></div><div class="ai-mp-stats">${(p.stats||[]).map(s=>`<div class="ai-mp-stat"><div class="ai-mp-stat-val">${s.value}</div><div class="ai-mp-stat-lbl">${s.label}</div></div>`).join('')}</div>`;
  }
  return `<div class="ai-mini-page">
    <div class="ai-mp-statusbar"><span>9:41</span><span>📶 🔋</span></div>
    <div class="ai-mp-header">${scene.miniTabs[idx]}</div>
    <div class="ai-mp-body">${body}</div>
    <div class="ai-mp-tabbar">${scene.miniTabs.map((t,i)=>`<span class="${i===idx?'tab-active':''}">${t}</span>`).join('')}</div>
  </div>`;
}

/* ===== PC端预览 ===== */
function renderPcPreview(scene){
  const pages=scene.pcPages||[];
  const tabs=pages.map((p,i)=>p.title);
  return `<div style="padding:16px">
    <div class="pc-mock">
      <div class="pc-mock-header">
        <div class="pc-mock-title">${scene.name}</div>
        <div class="pc-mock-user">👤 唯安 · 运营专员</div>
      </div>
      <div class="pc-mock-nav">
        ${tabs.map((t,i)=>`<div class="pc-mock-nav-item ${i===0?'active':''}" onclick="switchPcTab(this,'${i}')">${t}</div>`).join('')}
      </div>
      <div class="pc-mock-body" id="pcMockBody">
        ${renderPcPage(pages[0]||{})}
      </div>
    </div>
  </div>`;
}

function renderPcPage(page){
  if(!page||!page.type) return '<div style="padding:40px;text-align:center;color:var(--text-4)">页面内容</div>';
  if(page.type==='table'){
    const rows=page.rows||[];
    return `
      <div class="pc-mock-toolbar">
        <button class="btn btn-primary btn-sm">+ 新增活动</button>
        <button class="btn btn-sm">导出</button>
      </div>
      ${page.fields?`
      <div class="pc-mock-search">
        <input placeholder="搜索..."><select><option>全部状态</option></select><button class="btn btn-sm">查询</button>
      </div>`:''}
      <table class="pc-mock-table">
        <thead><tr>${(page.fields||[]).map(f=>`<th>${f}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>
          ${(r.cells||[]).map(c=>`<td>${c}</td>`).join('')}
          ${r.st?`<td>${r.st.map(s=>`<span class="tag tag-${s.c||'gray'}">${s.l}</span>`).join(' ')}</td>`:''}
          ${r.act?`<td>${r.act.map(a=>`<a style="color:var(--primary);cursor:pointer;margin-right:8px;font-size:12px">${a.l}</a>`).join('')}</td>`:''}
        </tr>`).join('')}
        </tbody>
      </table>`;
  }
  if(page.type==='stats'){
    return `
      <div class="pc-mock-stats">${(page.stats||[]).map(s=>`<div class="pc-mock-stat"><div class="pc-mock-stat-val">${s.v}</div><div class="pc-mock-stat-lbl">${s.l}</div></div>`).join('')}</div>
      ${page.chart?`<div style="background:#fff;border-radius:8px;border:1px solid var(--border-light);padding:40px;text-align:center;color:var(--text-4);font-size:13px">📊 ${page.desc||'图表区域'}</div>`:''}
      ${page.type==='profile'?'<div style="padding:40px;text-align:center;color:var(--text-4);font-size:13px">个人中心页面内容</div>':''}`;
  }
  return '<div style="padding:40px;text-align:center;color:var(--text-4)">页面内容</div>';
}

let _pcTabIdx=0;
window.switchPcTab=function(el,idxStr){
  const idx=parseInt(idxStr);
  _pcTabIdx=idx;
  document.querySelectorAll('.pc-mock-nav-item').forEach((e,i)=>e.classList.toggle('active',i===idx));
  const scene=AI_SCENES[STATE.result?.scene||'event'];
  const pages=scene.pcPages||[];
  const body=$('#pcMockBody');
  if(body) body.innerHTML=renderPcPage(pages[idx]||{});
};

/* ============ 画布交互 ============ */

function canvasChatSend(){
  const inp=$('#canvasChatInput');
  if(!inp) return;
  const text=inp.value.trim();
  if(!text||STATE.generating) return;
  inp.value='';
  STATE.chatMsgs.push({role:'user',text});
  STATE.generating=true;
  renderPage();
  scrollCanvasDown();
  setTimeout(()=>{
    STATE.generating=false;
    STATE.chatMsgs.push({role:'bot',text:`已根据"${text}"修改完成，请查看更新后的页面。`});
    renderPage();
    scrollCanvasDown();
  },1500);
}

function scrollCanvasDown(){
  setTimeout(()=>{
    const m=$('#canvasChatMsgs');
    if(m) m.scrollTop=m.scrollHeight;
  },50);
}

/* ============ 画布内需求说明书折叠卡片 ============ */
let _canvasSpecOpen={};

function renderCanvasMsg(m){
  if(m.spec){
    // 需求说明书卡片（可折叠段落）
    const keys=Object.keys(m.spec).slice(0,8);
    const labels=['应用概述','目标用户','页面范围','核心功能','数据字段','业务规则','本期不实现','验收重点'];
    if(!_canvasSpecOpen.header&&_canvasSpecOpen.header!==false) _canvasSpecOpen.header=true;
    return `
      <div class="canvas-chat-msg bot">
        <div class="canvas-chat-bubble canvas-spec-card" style="width:320px;padding:0;overflow:hidden">
          <div style="padding:10px 12px;background:var(--primary-light);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleCanvasSpecHeader()">
            <span style="font-size:12px;font-weight:600;color:var(--primary)">📋 需求说明书</span>
            <span style="font-size:11px;color:var(--text-3)">${_canvasSpecOpen.header?'▾ 收起':'▸ 展开'}</span>
          </div>
          <div id="canvasSpecHeaderBody" style="${_canvasSpecOpen.header?'':'display:none'};padding:10px 12px">
            ${keys.map((k,i)=>`
              <div style="margin-bottom:8px;border:1px solid var(--border-light);border-radius:8px;overflow:hidden">
                <div style="padding:7px 10px;background:#FAFBFC;font-size:11px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleCanvasSpecSection(${i})">
                  <span>${i+1}. ${labels[i]}</span>
                  <span style="color:var(--text-3);font-size:10px">${_canvasSpecOpen[`s${i}`]||i===0?'▾':'▸'}</span>
                </div>
                <div id="canvasSpecSection_${i}" style="${(_canvasSpecOpen[`s${i}`]===false)?'display:none':''};padding:8px 10px;font-size:11px;color:var(--text-2);line-height:1.7">${m.spec[k]||''}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  }
  return `
    <div class="canvas-chat-msg ${m.role}"><div class="canvas-chat-bubble">${m.text}</div></div>`;
}

function toggleCanvasSpecHeader(){
  _canvasSpecOpen.header=!_canvasSpecOpen.header;
  renderPage();
  scrollCanvasDown();
}

function toggleCanvasSpecSection(i){
  const k='s'+i;
  _canvasSpecOpen[k]=_canvasSpecOpen[k]===false?true:false;
  renderPage();
  scrollCanvasDown();
}

function clearCanvasInput(){
  const inp=$('#canvasChatInput');
  if(inp) inp.value='';
  showToast('输入框已清空','info');
}

/* ============ 我的应用 ============ */
function openMyApp(id){
  const a=DATA.apps.find(x=>x.id===id);
  if(!a) return;
  STATE.page='canvas';
  STATE.result={scene:a.scene};
  STATE.currentApp=a;
  STATE.chatMsgs=[
    {role:'bot',text:`打开「${a.name}」，可在画布中预览，或在对话框描述修改需求。`}
  ];
  STATE.generating=false;
  renderPage();
}

/* ============ 发布 ============ */
function doPublish(){
  const sceneKey=STATE.result?.scene||'event';
  const scene=AI_SCENES[sceneKey];
  const newApp={
    id:'APP-'+String(DATA.apps.length+1).padStart(3,'0'),
    name:scene.name, ver:'v1.0.0', status:'已上线', icon:scene.icon,
    color:scene.color, users:1, calls:0, rating:0, desc:scene.desc, scene:sceneKey
  };
  DATA.apps.unshift(newApp);
  openModal('🎉 发布成功',`
    <div style="text-align:center;padding:16px 0">
      <div style="font-size:48px;margin-bottom:10px">🎉</div>
      <div style="font-size:18px;font-weight:600;color:var(--text-1);margin-bottom:6px">发布成功！</div>
      <div style="font-size:13px;color:var(--text-3);margin-bottom:16px">${scene.name} 已上线</div>
      <div style="background:#FAFAF7;border-radius:10px;padding:14px;text-align:left;max-width:360px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--text-3)">应用名称</span><strong>${scene.name}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--text-3)">版本</span>v1.0.0</div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-3)">访问等级</span>${scene.level}</div>
      </div>
    </div>`,null,true);
  STATE.page='home';
  setTimeout(()=>{closeModal();renderPage();},3000);
}

/* ============ 公共 ============ */
function backToHome(){
  STATE.page='home';
  STATE.nav='home';
  STATE.generating=false;
  renderPage();
}

/* ============ 初始化 ============ */
document.addEventListener('DOMContentLoaded',()=>{
  // 登录页默认焦点
  $('#loginUser')?.focus();
});
</script>
</body>
</html>
