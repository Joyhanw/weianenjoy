<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用蓝图框架教程</title>
<style>
:root {
  --navy:#0f2b46; --navy-light:#1a3f63; --navy-lighter:#2a5580;
  --gold:#c8963e; --gold-light:#d4a85a; --gold-pale:#fdf6ed;
  --white:#fff; --bg:#f4f6f9; --card:#fff;
  --text-primary:#1d2129; --text-secondary:#4e5969; --text-muted:#86909c;
  --border:#e5e6eb; --border-light:#f2f3f5;
  --green:#00b42a; --orange:#ff7d00; --red:#f53f3f; --blue:#165dff;
  --shadow:0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --transition:.35s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.7;height:100vh;overflow:hidden}

/* ===== App ===== */
#app{height:100vh;width:100vw;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity var(--transition);overflow-y:auto;padding:32px 48px 100px}
.slide.active{opacity:1;pointer-events:auto;z-index:2}
.slide-content{max-width:1200px;margin:0 auto;width:100%}

/* ===== Topbar ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--border);z-index:120}
.topbar-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));transition:width .4s ease;width:0}

/* ===== Side Nav ===== */
.side-nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:110;display:flex;flex-direction:column;gap:14px}
.side-nav-item{display:flex;align-items:center;gap:8px;cursor:pointer;flex-direction:row-reverse}
.side-nav-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all var(--transition)}
.side-nav-item.active .side-nav-dot{background:var(--navy);box-shadow:0 0 0 3px rgba(15,43,70,.2);width:12px;height:12px}
.side-nav-item:hover .side-nav-dot{background:var(--gold)}
.side-nav-label{font-size:12px;color:var(--text-muted);white-space:nowrap;opacity:0;transform:translateX(6px);transition:all var(--transition);pointer-events:none}
.side-nav-item:hover .side-nav-label,.side-nav-item.active .side-nav-label{opacity:1;transform:translateX(0)}

/* ===== Bottom Nav ===== */
.nav-bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:10px 20px;gap:6px}
.nav-dot{width:28px;height:3px;border-radius:2px;background:var(--border);border:none;cursor:pointer;transition:all var(--transition)}
.nav-dot.active{width:42px;background:var(--navy)}
.nav-dot:hover{background:var(--gold)}

/* ===== Arrows ===== */
.nav-arrow{position:fixed;bottom:80px;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-secondary);transition:all .15s;z-index:100}
.nav-arrow:hover{background:var(--navy);color:var(--white);border-color:var(--navy)}
.nav-arrow.left{left:24px}
.nav-arrow.right{right:56px}
.nav-label{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-muted);z-index:100}

/* ===== Typo ===== */
.section-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:10px}
.section-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.highlight{color:var(--gold);font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.pill-blue{background:#f0f5ff;color:var(--blue)}
.pill-green{background:#f0fdf4;color:var(--green)}
.pill-orange{background:#fff7e8;color:var(--orange)}
.pill-gold{background:var(--gold-pale);color:var(--gold)}

/* ===== Cards ===== */
.card-grid{display:grid;gap:14px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
.cols-5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
.info-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px;transition:all .15s}
.info-card:hover{box-shadow:var(--shadow)}
.info-card-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.info-card-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.7}

/* ===== Story line ===== */
.story-line{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 0}
.story-node{background:var(--white);border:2px solid var(--border);border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;color:var(--navy)}
.story-arrow{color:var(--gold);font-size:18px;font-weight:700}

/* ===== Code Blocks ===== */
.code-block{position:relative;background:#1a2332;border-radius:10px;margin:10px 0;overflow:hidden}
.code-block-header{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:rgba(255,255,255,.4)}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border:1px solid rgba(255,255,255,.15);border-radius:4px;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:11px;transition:all .15s;font-family:inherit}
.copy-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3)}
.copy-btn.copied{background:rgba(0,180,42,.2);border-color:var(--green);color:var(--green)}
.code-block pre{padding:14px 16px;margin:0;overflow-x:auto;font-family:'SF Mono','Fira Code',Consolas,Monaco,monospace;font-size:12.5px;line-height:1.8;color:#e6edf3}
.code-block pre code{white-space:pre-wrap;word-break:break-word}

/* ===== Gold / Think blocks ===== */
.gold-block{border-left:3px solid var(--gold);background:var(--gold-pale);padding:12px 16px;border-radius:0 6px 6px 0;margin:14px 0;font-size:13px;color:var(--text-primary);line-height:1.8}
.think-block{border-left:3px solid var(--blue);background:#f0f5ff;padding:12px 16px;border-radius:0 6px 6px 0;margin:14px 0;font-size:13px;color:var(--text-primary);line-height:1.8}

/* ===== Check lists ===== */
.checklist{list-style:none;display:flex;flex-direction:column;gap:5px}
.checklist li{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fafbfc;border-radius:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s;user-select:none}
.checklist li:hover{background:#f0f5ff}
.checklist li .chk{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s;flex-shrink:0}
.checklist li.checked .chk{background:var(--green);border-color:var(--green);color:#fff}
.checklist li.checked{color:var(--green)}

/* ===== Matrix ===== */
.matrix-table{width:100%;border-collapse:collapse;font-size:12px}
.matrix-table th,.matrix-table td{border:1px solid var(--border);padding:10px 12px;text-align:center}
.matrix-table th{background:var(--navy);color:#fff;font-weight:500}
.matrix-table td{transition:all .12s;background:var(--white)}
.matrix-table td:hover{background:var(--gold-pale)}
.matrix-table .corner{background:#f7f8fa;color:var(--text-muted);font-size:11px}

/* ===== Step num ===== */
.step-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;flex-shrink:0;margin-right:8px}

/* ===== Divider ===== */
.divider{border-top:1px solid var(--border-light);margin:18px 0 16px}

/* ===== Tag ===== */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;margin:1px 2px}
.tag-blue{background:#f0f5ff;color:var(--blue)}
.tag-green{background:#f0fdf4;color:var(--green)}
.tag-orange{background:#fff7e8;color:var(--orange)}

/* ===== Timeline ===== */
.timeline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:12px 0}
.timeline-item{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px;border-top:3px solid var(--border);transition:all .15s}
.timeline-item:hover{box-shadow:var(--shadow)}
.timeline-item.p1{border-top-color:var(--blue)}
.phase-num{font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:2px}
.phase-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px}
.phase-time{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:8px}
.phase-goal{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.phase-list{list-style:none;font-size:11.5px;color:var(--text-secondary);line-height:1.9}
.phase-list li::before{content:'• ';color:var(--navy);font-weight:700}

/* ===== Drawer ===== */
.drill-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.drill-overlay.open{opacity:1;pointer-events:auto}
.drill-panel{position:fixed;top:0;right:-520px;width:460px;height:100vh;background:var(--white);z-index:201;box-shadow:-4px 0 24px rgba(0,0,0,.15);transition:right .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:32px 28px}
.drill-panel.open{right:0}
.drill-close{position:sticky;top:0;float:right;width:32px;height:32px;border:1px solid var(--border);background:var(--white);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;z-index:1}
.drill-close:hover{background:var(--bg);color:var(--text-primary)}
.drill-title{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}
.drill-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:18px;line-height:1.6}
.drill-section{margin-bottom:16px}
.drill-section h4{font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.drill-section .content{font-size:13px;color:var(--text-primary);line-height:1.9}
.dc-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:12.5px;line-height:1.6}
.dc-item:last-child{border:none}
.dc-num{color:var(--navy);font-weight:700;min-width:22px;flex-shrink:0}
.dc-text{color:var(--text-secondary)}

/* ===== Cover ===== */
.cover-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}
.cover-icon{font-size:56px;margin-bottom:16px}
.cover-title{font-size:30px;font-weight:700;color:var(--navy);margin-bottom:8px}
.cover-subtitle{font-size:15px;color:var(--gold);font-weight:500;margin-bottom:8px}
.cover-divider{width:60px;height:3px;background:var(--gold);margin:16px auto 20px;border-radius:2px}

/* ===== Responsive ===== */
@media(max-width:768px){
  .slide{padding:24px 16px 90px}
  .card-grid.cols-2,.card-grid.cols-3,.card-grid.cols-4,.card-grid.cols-5{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr}
  .drill-panel{width:100vw}
  .nav-arrow.left{left:8px}.nav-arrow.right{right:40px}
  .story-line{gap:6px}
  .story-node{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>

<div id="app"></div>

<!-- Top bar -->
<div class="topbar"><div class="topbar-fill" id="topbarFill"></div></div>

<!-- Side nav dots -->
<div class="side-nav" id="sideNav"></div>

<!-- Drill -->
<div class="drill-overlay" id="drillOverlay" onclick="closeDrill()"></div>
<div class="drill-panel" id="drillPanel"></div>

<!-- Bottom nav -->
<div class="nav-bottom" id="navBottom"></div>

<!-- Arrows -->
<button class="nav-arrow left" onclick="prevSlide()" title="上一页">◂</button>
<button class="nav-arrow right" onclick="nextSlide()" title="下一页">▸</button>
<div class="nav-label" id="navLabel"></div>

<script>
// ============ DATA ============
const TOTAL = 8;
const sideLabels = ['封面','资料收集\n& 理解问题','梳理角色\n& 职责','设计架构\n& 拆解流程','建设路线\n& 一期范围','多轮确认\n& 生成HTML','5页蓝图\n输出规范','Skill模板\n& 检查清单'];

// ============ SLIDE HTML ============
const slidesHTML = [
  // SLIDE 0: Cover
  `<div class="slide-content">
    <div class="cover-center">
      <div class="cover-icon">📘</div>
      <div class="cover-title">通用蓝图框架教程</div>
      <div class="cover-subtitle">企业级战略蓝图 · 设计方法论</div>
      <div class="cover-divider"></div>
      <div style="max-width:600px;font-size:13px;color:var(--text-secondary);line-height:2.2;text-align:left;margin:0 auto">
        本教程记录了一套<strong>可复用的蓝图设计方法论</strong>——<br>
        不是教你怎么画PPT，而是教你怎么<strong>思考</strong>：<br><br>

        · 怎么把混乱的需求梳理成清晰的方案？<br>
        · 怎么让方案形成一条客户听得懂的<strong>故事线</strong>？<br>

      <div class="story-line" style="margin-top:18px">
        <span class="story-node">问题</span><span class="story-arrow">→</span>
        <span class="story-node">目标</span><span class="story-arrow">→</span>
        <span class="story-node">方案</span><span class="story-arrow">→</span>
        <span class="story-node">角色</span><span class="story-arrow">→</span>
        <span class="story-node">路线</span><span class="story-arrow">→</span>
        <span class="story-node">落地</span>
      </div>
      <div style="margin-top:10px;font-size:11px;color:var(--text-muted)">唯安</div>
    </div>
  </div>`,

  // SLIDE 1: Step 1-2
  `<div class="slide-content">
    <div class="section-title"><span class="step-num">1</span>资料收集与项目背景分析</div>
    <div class="section-subtitle" style="margin-left:36px">先把客户给的材料喂给AI，让它帮你梳理</div>

    <div style="font-weight:600;color:var(--gold);font-size:13px;margin-bottom:6px">💬 这一步的提示词</div>
    <div class="code-block">
      <div class="code-block-header"><span class="code-block-lang">分析材料 · 可复制</span><button class="copy-btn" onclick="copyCode(this,'s1-1')">📋 复制</button></div>
      <pre><code id="code-s1-1">你先分析一下我上传给你的来源资料</code></pre>
    </div>

    <div class="think-block">
      <strong>🧠 这一步在做什么：</strong><br>
      把客户提供的所有材料（需求文档、会议纪要、组织架构等）直接给AI。不要自己先消化——让AI帮你提取关键信息、发现盲区。AI的分析往往会发现你没注意到的点。
    </div>

    <div class="divider"></div>

    <div class="section-title"><span class="step-num">2</span>理解客户问题 & 明确建设目标</div>
    <div class="section-subtitle" style="margin-left:36px">从"客户现状"推导到"要解决什么"</div>

    <div class="gold-block">
      <strong>📌 泰隆银行的实际情况：</strong><br>
      行内有上万名员工，每天产生大量业务需求，但总行科技资源有限，需求严重积压、响应缓慢。<br>
      员工用Excel维护客户信息，技术资源被重复建设消耗，缺乏统一的能力复用和运营管理机制。
    </div>

    <div style="font-weight:600;color:var(--gold);font-size:13px;margin-bottom:6px">💬 这一步的提示词（核心）</div>
    <div class="code-block">
      <div class="code-block-header"><span class="code-block-lang">问题分析提示词 · 可复制</span><button class="copy-btn" onclick="copyCode(this,'s2-1')">📋 复制</button></div>
      <pre><code id="code-s2-1">我现在需要输出两份东西：
1. 针对这个项目的蓝图规划，要跟客户汇报
2. 这个项目一期先实现的功能原型，带交互的，重点是给行内演示

先梳理整个项目的架构蓝图，这个也要讲成故事线。比如：
- 行内现在遇到的问题
- 要解决这些问题需要做什么
- 分几块来做
- 这些是谁来做，分别承担什么职责
- 需要做什么事情，对应系统的功能是什么
- 串起来讲，再给客户看原型

我现在给你的资料是自己梳理的，可能不准确。

核心问题：行内员工有上万名，他们会提很多需求，但到总行后这些需求都积压在一起，没办法快速响应。

解决方案方向：
- 给员工提供一个入口，里面可以自己提需求、自己开发
- 涉及不同角色：小白、技术、运营、管理者等
- 可沉淀的企业能力，需求不需要重复创建
- 如果涉及很难的需求，总行没有组件，通知总行来弄组件
- 运营需要管理，管理员也要看

现在行内也不知道要怎么管理这个，所以我们要给解决方案、给工具、教行内的人怎么做。

你先分析一下，有问题就问我，不要捏造，然后我们确认一个方向。</code></pre>
    </div>

    <div class="think-block">
      <strong>🧠 设计思路：</strong><br>
      这个提示词的核心是<strong>用大白话把你知道的全部说出来</strong>——客户是谁、痛点是什么、你觉得大概方向是什么。不需要很专业，越直白越好。AI会帮你把碎片信息整理成结构化的分析。关键是<strong>不要捏造</strong>，不清楚的地方让AI反问你。
    </div>
  </div>`,

  // SLIDE 2: Step 3
  `<div class="slide-content">
    <div class="section-title"><span class="step-num">3</span>梳理业务角色 & 职责划分</div>
    <div class="section-subtitle" style="margin-left:36px">明确：谁使用？谁建设？谁管理？谁决策？</div>

    <div class="gold-block">
      <strong>📌 泰隆银行角色梳理过程：</strong><br>
      前期不清楚具体组织架构时，先根据已知信息假设角色——客户经理、技术、运营、管理者。<br>
      后续聊的过程中逐步细化：涉及审核 → 补充业务Owner；涉及安全 → 补充安全员。<br>
      <strong>注意：</strong>初期角色可合并展示，等大框架确认后再细化。
    </div>

    <div style="font-weight:600;color:var(--gold);font-size:13px;margin-bottom:6px">💬 这一步的提示词</div>

      <pre><code id="code-s3-1">1. 主要服务对象应该是全体员工，每个员工的职责不一样，这个需要我们根据解决方案跟银行的人说每个职位的职责。已知的有小白客户经理、技术人员、运营、管理人员，其他的需要我们来分析。

# 通用蓝图模板 Skill

按照 **故事线驱动** 的标准，生成一个自包含的 HTML 蓝图页面。输出到 &#96;/Users/han/Documents/hn/&#96; 下，文件名自定。

## 核心原则：问题 → 方案 → 角色 → 路线 → 落地

每一页都必须遵循这条逻辑链。永远不要堆砌功能——每个组件都要锚定在它解决的问题和负责的角色上。

## 3. 右侧抽屉（全部下钻内容的统一容器）

**关键要求**：所有可展开的详情内容必须通过右侧抽屉展示——**绝不用弹窗、弹出层或新页面**。

### HTML 结构
&#96;&#96;&#96;html
&lt;!-- 遮罩层：点击关闭 --&gt;
&lt;div class="drill-overlay" onclick="closeDrill()"&gt;&lt;/div&gt;

&lt;!-- 抽屉面板：从右侧滑入 --&gt;
&lt;div class="drill-panel"&gt;
  &lt;button class="drill-close"&gt;✕&lt;/button&gt;
  &lt;!-- JS 动态注入内容 --&gt;
&lt;/div&gt;
&#96;&#96;&#96;

### CSS 规格
&#96;&#96;&#96;
遮罩层：fixed 全屏覆盖，rgba(0,0,0,0.4)，透明度 0→1 过渡
面板：fixed，right: -520px → 0，宽度 460px，高度 100vh
      白色背景，阴影：-4px 0 24px rgba(0,0,0,0.15)
      过渡：right .35s cubic-bezier(.4,0,.2,1)
      纵向滚动，内边距：32px 28px
关闭按钮：34px 圆形按钮，右上角，带边框
&#96;&#96;&#96;

### 抽屉内容区块规范
&#96;&#96;&#96;
标题：20px，字重 700，深蓝色
副标题：13px，次要文字色
分区：
  - h4 标签：12px，辅助文字色，大写，字间距加宽
  - 正文：13px，行高 1.7
能力列表项：
  - 编号圆圈（22px，深蓝背景，白色数字）
  - 文字紧贴编号右侧
&#96;&#96;&#96;

### 哪些内容用抽屉展示
- 点击架构模块 → 展示该中心的完整能力列表
- 点击角色卡片 → 展示角色详情（级别、人员、任务、入口、职责）
- 点击旅程节点 → 展示系统做了什么 + 产出什么
- 点击矩阵单元格 → 展示角色详情
- 点击指标 → 展示计算口径
- 任何标注"点击查看详情"的位置

## 4. 页面结构 —— 最少 5 页

### 第 0 页：封面
- 大号 emoji 图标（56px）
- 标题：&#96;40px / 字重 800 / 深蓝色 / 字间距 1px&#96;
- 副标题：&#96;17px / 次要文字色 / 字间距 2px&#96;
- 垂直水平居中

### 第 1 页：全景建设蓝图 —— **最重要的一页**

这一页必须把完整故事讲清楚。包含以下四个必选区域，按顺序排列：

#### 区域 A：当前面临的问题（为什么要建）
布局：**痛点流转卡片** —— 横向卡片，用 &#96;→&#96; 箭头串联。

每张卡片：
&#96;&#96;&#96;
┌──────────────────────┐
│ ① （金色编号）       │
│ 🏪 角色（辅助文字）  │
│ 痛点描述（加粗）     │
│ "期望"（灰色斜体）   │
└──────────────────────┘
&#96;&#96;&#96;

后面紧跟：
- **恶性循环**：彩色药丸标签，用 &#96;→&#96; 串联，末尾为红色加粗
  - 药丸颜色：红 → 橙 → 黄 → 红 → 深红
- **核心矛盾**：3 项并排，每项包含加粗标题 + 解释说明
- **结论**：一句总结，居中显示，核心洞察用金色高亮

#### 区域 B：解决方案总体蓝图（建什么）
布局：**架构模块卡片** —— 一排可点击卡片。

每张卡片：
&#96;&#96;&#96;
┌────────────────┐
│  📋  图标       │
│  标题           │（16px，加粗，深蓝）
│  解决：xxx      │（11px，辅助文字）
│  AI 做什么      │（12px，灰色背景）
└────────────────┘
悬停：上浮 3px，显示彩色边框 + 浅色背景
点击 → 右侧抽屉展示完整能力列表
&#96;&#96;&#96;

卡片下方：连接符 &#96;▼&#96; + 统一底座卡片（更宽，居中）。

#### 区域 C：角色体系（谁来做）
布局：**角色卡片**，分两行排列。

&#96;&#96;&#96;
第一行：▼ 需求侧（提需求 · 造应用 · 确认价值）
  [普通使用者] [业务创新者] [业务Owner]

第二行：▼ 供给侧（建能力 · 守红线 · 管运营）
  [总行科技] [安全合规] [平台运营] [管理者]
&#96;&#96;&#96;

每张卡片：顶部彩色边框，图标，名称，所属部门，一句话职责说明。
点击 → 右侧抽屉展示完整角色详情（级别、人员、任务、入口、职责）。

#### 区域 D：运行闭环（怎么跑起来）
布局：**9 步旅程节点条** —— 横向节点，用 &#96;→&#96; 串联。

每个节点：
&#96;&#96;&#96;
┌──────────┐
│ 第 N 步   │（10px，辅助文字）
│ 节点名称  │（12px，加粗，深蓝）
└──────────┘
&#96;&#96;&#96;

9 个步骤（可视情况换行）：
1. 需求提出 → 2. AI 分析 → 3. 能力匹配 → 4. 应用生成 → 5. 测试验证 → 6. 审核发布 → 7. 上线使用 → 8. 运营分析 → 9. 能力沉淀

点击每个步骤 → 抽屉展示：系统做了什么 + 产出物是什么

### 第 2 页：角色矩阵
- 组织层级（行）× 角色（列）的交叉表
- 集中式角色（总行科技、安全合规、平台运营）跨 3 行合并
- 行标题：总行 / 分行 / 支行，各有不同背景色
- 每个单元格：可点击，简要说明，带 &#96;›&#96; 指示符
- 点击 → 抽屉展示完整角色详情

### 第 3 页：分阶段建设路线
- 3 张并排的时间线卡片
- 第一阶段：金色边框高亮
- 第二阶段
- 第三阶段
- 每张卡片：阶段编号、标题、目标、要点列表、验收标准框

### 第 4 页：一期实施计划
- 双列网格布局：
  - 交付内容
  - 运营策略
- 全宽卡片：**北极星指标** —— 深蓝底色，白色文字
- 全宽卡片：**五维上线标准** —— 5 个指标卡片并排
- 全宽金色卡片：**扩围门槛** —— 5 个准入条件（药丸标签）
- 底部：**两个关键闭环** —— 并排紧凑循环图
  - 能力缺口闭环
  - 应用生命周期闭环
- 结尾备注：金色背景，原型引用

## 5. 内容质量红线

### 绝对不能做：
- ❌ 脱离场景堆砌功能
- ❌ 列能力但不说明每项解决什么问题
- ❌ 跳过"为什么"——每个模块都必须回答"解决什么问题"
- ❌ 用"功能模块""系统架构"这类空泛标题
- ❌ 把"当前问题"和"解决方案"拆到不同页面——它们必须在全景蓝图这一页中同时呈现

### 必须做到：
- ✅ 每个架构模块：&#96;图标 + 标题 + 解决：xxx + AI 如何实现&#96;
- ✅ 每个角色：&#96;谁 + 解决什么问题 + 做什么 + 承担什么职责&#96;
- ✅ 每个阶段：&#96;目标 + 交付物 + 验收标准&#96;
- ✅ 每个旅程节点：&#96;发生什么 + 产出什么&#96;
- ✅ 用具体例子（例如"客户经理拜访管理"代替"业务场景"）
- ✅ 关键数字和结论用金色高亮（&#96;class="highlight"&#96;）

// ============ INIT ============
let current = 0;

function init(){
  // Build slides
  const app = document.getElementById('app');
  slidesHTML.forEach((html, i) => {
    const div = document.createElement('div');
    div.className = 'slide';
    div.setAttribute('data-index', i);
    div.innerHTML = html;
    app.appendChild(div);
  });

  buildSideNav();
  buildDots();
  goTo(0);

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); nextSlide(); }
    if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); prevSlide(); }
    if(e.key === 'Escape') closeDrill();
  });
}

function buildSideNav(){
  const sn = document.getElementById('sideNav');
  sn.innerHTML = sideLabels.map((l, i) => `
    <div class="side-nav-item" onclick="goTo(${i})" title="${l.replace(/\n/g,' ')}">
      <span class="side-nav-label">${l.replace(/\n/g,'<br>')}</span>
      <span class="side-nav-dot"></span>
    </div>
  `).join('');
}

function buildDots(){
  const nb = document.getElementById('navBottom');
  for(let i = 0; i < TOTAL; i++){
    const d = document.createElement('button');
    d.className = 'nav-dot';
    d.title = `第${i+1}页`;
    d.onclick = () => goTo(i);
    nb.appendChild(d);
  }
}

function goTo(i){
  current = Math.max(0, Math.min(TOTAL - 1, i));
  document.querySelectorAll('.slide').forEach((s, idx) => s.classList.toggle('active', idx === current));
  document.querySelectorAll('.nav-dot').forEach((d, idx) => d.classList.toggle('active', idx === current));
  document.querySelectorAll('.side-nav-item').forEach((d, idx) => d.classList.toggle('active', idx === current));
  document.getElementById('topbarFill').style.width = ((current + 1) / TOTAL * 100) + '%';
  document.getElementById('navLabel').textContent = `${current + 1} / ${TOTAL}`;
  const activeSlide = document.querySelector('.slide.active');
  if(activeSlide) activeSlide.scrollTo(0, 0);
}

function nextSlide(){ if(current < TOTAL - 1) goTo(current + 1); }
function prevSlide(){ if(current > 0) goTo(current - 1); }

// ============ DRILL ============
function openDrillPanel(){
  document.getElementById('drillOverlay').classList.add('open');
  document.getElementById('drillPanel').classList.add('open');
  document.getElementById('drillPanel').scrollTo(0, 0);
}
function closeDrill(){
  document.getElementById('drillOverlay').classList.remove('open');
  document.getElementById('drillPanel').classList.remove('open');
}

// ============ COPY CODE ============
function copyCode(btn, codeId){
  const el = document.getElementById('code-' + codeId);
  if(!el) return;
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 复制'; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 复制'; btn.classList.remove('copied'); }, 1800);
  });
}

// ============ CHECKLIST TOGGLE ============
function toggleCheck(el){ el.classList.toggle('checked'); }

// ============ START ============
init();
